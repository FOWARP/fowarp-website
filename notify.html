<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOWARP 방문 알림</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FOWARP">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    color: #000;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: #888; margin: 0 0 28px; }

  .card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .state { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .desc { font-size: 13px; line-height: 1.6; color: #666; margin: 0; }

  button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #000;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 14px;
  }
  button:disabled { background: #ccc; cursor: default; }
  button.ghost { background: #f2f2f2; color: #000; }

  .steps { font-size: 13px; line-height: 1.8; color: #444; padding-left: 20px; margin: 10px 0 0; }
  .steps code {
    background: #f2f2f2; padding: 1px 5px; border-radius: 4px;
    font-size: 12px; font-family: ui-monospace, monospace;
  }

  .hidden { display: none; }

  /* ── 통계 ── */
  .stat-day { border-top: 1px solid #eee; padding: 16px 0; }
  .stat-day:first-of-type { border-top: 0; }
  .stat-date { font-size: 12px; color: #888; margin: 0 0 8px; }
  .stat-date.today { color: #000; font-weight: 600; }
  .stat-big { display: flex; gap: 18px; margin-bottom: 10px; }
  .stat-big div { font-size: 13px; color: #666; }
  .stat-big b { display: block; font-size: 22px; color: #000; letter-spacing: -0.02em; }
  .stat-row { font-size: 13px; line-height: 1.7; color: #444; }
  .stat-row .k { color: #999; display: inline-block; min-width: 52px; }
  .stat-contact {
    margin-top: 10px; padding: 10px 12px;
    background: #f7f7f7; border-radius: 8px;
    font-size: 13px; line-height: 1.6;
  }
  .stat-contact b { color: #000; }
  .stat-empty { font-size: 13px; color: #bbb; }
  #reload {
    width: 100%; padding: 12px; margin-top: 4px;
    border: 1px solid #e5e5e5; border-radius: 10px;
    background: #fff; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .ok { color: #0a7d32; }
  .err { color: #c00; }
</style>
</head>
<body>

<h1>FOWARP 방문 알림</h1>
<p class="sub">fowarp.com 에 사람이 들어오면 이 폰으로 알림이 온다.</p>

<div class="card">
  <p class="state" id="state">확인 중…</p>
  <p class="desc" id="desc"></p>
  <button id="enable" class="hidden">알림 켜기</button>
  <button id="test" class="ghost hidden">테스트 알림 보내기</button>
</div>

<div class="card hidden" id="installCard">
  <p class="state">먼저 홈 화면에 추가해야 한다</p>
  <p class="desc">아이폰은 홈 화면에 추가한 뒤에만 알림을 받을 수 있다.</p>
  <ol class="steps">
    <li>사파리 하단 <strong>공유</strong> 버튼 탭</li>
    <li><strong>홈 화면에 추가</strong> 선택</li>
    <li>홈 화면의 <strong>FOWARP</strong> 아이콘으로 다시 열기</li>
  </ol>
</div>

<div class="card" id="statCard">
  <p class="state">방문 통계</p>
  <div id="statBody"><p class="desc">불러오는 중…</p></div>
  <button id="reload">새로고침</button>
</div>

<script>
(function () {
  'use strict';

  var VAPID = 'BD7m5U4ImBMtj3Wu3Rg08hHVk36G-w68rdzbpNU0tnXl6E-Qkm6sbLlRfF8bEkQIQ4gWC9K8WvMSb1unq8rBP7I';

  var $ = function (id) { return document.getElementById(id); };
  var state = $('state'), desc = $('desc');

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  function b64ToU8(s) {
    var pad = '='.repeat((4 - s.length % 4) % 4);
    var raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, function (c) { return c.charCodeAt(0); });
  }

  // ── 방문 통계 ─────────────────────────────────────
  // 알림 본문은 두 줄뿐이라, 자세한 내용은 여기서 본다.
  var PAGE_NAMES = {
    '/': '메인', '/index': '메인', '/contact': '컨택트',
    '/starbucks': 'Starbucks\u00ae', '/calmlab': 'Calmlab+', '/kohonjin': 'Kohonjin',
    '/unknot': 'Unknot', '/goventure': 'Goventure Forum', '/jjonjingeo': '쫀징어',
    '/gonyakjelly': '단백질 곤약젤리', '/gooumcookit': '구움쿠킷',
    '/hwanghugung': '황후궁 삼계탕', '/nosugaradded': 'No Sugar Added',
    '/returnity-skinhealer': 'Returnity 스킨힐러',
    '/returnity-scalp': 'Returnity 두피 스왑',
    '/antursolais': 'An Túr Solais',
    '/returnity-promo': 'Returnity 시즈널 프로모션'
  };
  function pname(p) { return PAGE_NAMES[(p || '').replace(/\/$/, '') || '/'] || p; }
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function dur(sec) {
    if (!sec) return '-';
    if (sec < 60) return sec + '초';
    var m = Math.floor(sec / 60);
    return m >= 60 ? Math.floor(m / 60) + '시간 ' + (m % 60) + '분' : m + '분 ' + (sec % 60) + '초';
  }
  function topN(obj, n) {
    return Object.keys(obj || {})
      .map(function (k) { return [k, obj[k]]; })
      .sort(function (a, b) { return b[1] - a[1]; })
      .slice(0, n);
  }

  function renderStats(data) {
    var box = $('statBody');
    if (!data || data.error || !data.days) {
      box.innerHTML = '<p class="desc">' + esc((data && data.error) || '불러오지 못했다') + '</p>';
      return;
    }
    var today = data.days[0] && data.days[0].date;
    var html = data.days.map(function (d) {
      var c = d.count || {};
      var visits = +c.visits || 0, submits = +c.submits || 0;
      if (!visits && !submits) return '';

      var sessions = +c.sessions || 0, dwell = +c.dwellSum || 0;
      var avg = sessions ? Math.round(dwell / sessions) : 0;

      var pages = {};
      Object.keys(d.pages || {}).forEach(function (k) {
        if (k !== '/' && k !== '/contact') pages[k] = d.pages[k];
      });

      var out = '<div class="stat-day">';
      out += '<p class="stat-date' + (d.date === today ? ' today' : '') + '">'
           + esc(d.date) + (d.date === today ? ' (오늘)' : '') + '</p>';
      out += '<div class="stat-big">'
           + '<div>방문<b>' + visits + '</b></div>'
           + '<div>방문자<b>' + (d.uniques || 0) + '</b></div>'
           + '<div>평균 체류<b>' + dur(avg) + '</b></div></div>';

      out += '<div class="stat-row">';
      out += '<span class="k">첫·재방문</span>' + (+c.first || 0) + ' · ' + (+c.returning || 0) + '<br>';
      var tp = topN(pages, 4);
      if (tp.length) out += '<span class="k">인기</span>'
        + tp.map(function (x) { return esc(pname(x[0])) + ' ' + x[1]; }).join(' · ') + '<br>';
      var tr = topN(d.refs, 4);
      if (tr.length) out += '<span class="k">유입</span>'
        + tr.map(function (x) { return esc(x[0]) + ' ' + x[1]; }).join(' · ');
      out += '</div>';

      out += '<div class="stat-contact">📮 컨택트 방문 <b>' + (+c.contactViews || 0)
           + '</b> · 쓰다 이탈 <b>' + (+c.formAbandon || 0)
           + '</b> · 제출 <b>' + submits + '</b>';
      var cf = topN(d.contactFrom, 2);
      if (cf.length) out += '<br>직전에 본 페이지: '
        + cf.map(function (x) { return esc(pname(x[0])) + ' ' + x[1]; }).join(' · ');
      out += '</div></div>';
      return out;
    }).join('');
    box.innerHTML = html || '<p class="stat-empty">최근 7일간 방문 기록이 없다.</p>';
  }

  // 통계 키는 한 번만 ?k=… 로 열어 주면 저장해 두고 이후 알아서 붙인다.
  // 홈 화면에 추가한 앱은 주소가 고정이라 매번 쿼리를 달 수 없기 때문이다.
  (function () {
    var m = location.search.match(/[?&]k=([^&]*)/);
    if (m) { try { localStorage.setItem('fw_stats_key', decodeURIComponent(m[1])); } catch (e) {} }
  })();
  function statsUrl() {
    var k = '';
    try { k = localStorage.getItem('fw_stats_key') || ''; } catch (e) {}
    return '/api/stats' + (k ? '?k=' + encodeURIComponent(k) : location.search);
  }

  function askKey() {
    var cur = '';
    try { cur = localStorage.getItem('fw_stats_key') || ''; } catch (e) {}
    $('statBody').innerHTML =
      '<p class="desc">통계를 보려면 키가 필요하다.' +
      (cur ? ' 저장된 키가 서버와 맞지 않는다.' : '') + '</p>' +
      '<input id="keyInput" type="text" placeholder="통계 키 붙여넣기" ' +
      'autocomplete="off" autocapitalize="off" spellcheck="false" ' +
      'style="width:100%;box-sizing:border-box;padding:10px;margin:8px 0;' +
      'border:1px solid #444;border-radius:8px;background:#111;color:#fff;font-size:16px">' +
      '<button id="keySave" style="width:100%;padding:10px;border:0;border-radius:8px;' +
      'background:#fff;color:#000;font-size:15px">저장하고 불러오기</button>';
    $('keyInput').value = cur;
    $('keySave').onclick = function () {
      var v = $('keyInput').value.trim();
      if (!v) return;
      try { localStorage.setItem('fw_stats_key', v); } catch (e) {}
      loadStats();
    };
  }

  function loadStats() {
    $('statBody').innerHTML = '<p class="desc">불러오는 중…</p>';
    fetch(statsUrl(), { cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { askKey(); return null; }
        return r.json();
      })
      .then(function (d) { if (d) renderStats(d); })
      .catch(function (e) {
        $('statBody').innerHTML = '<p class="desc">불러오지 못했다: ' + esc(e.message) + '</p>';
      });
  }
  $('reload').onclick = loadStats;
  loadStats();
  // 알림을 탭해 앱이 다시 떠오를 때 최신값으로
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') loadStats();
  });

  var isStandalone = navigator.standalone === true ||
                     matchMedia('(display-mode: standalone)').matches;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    if (isIOS && !isStandalone) {
      state.textContent = '홈 화면에 추가가 필요하다';
      desc.textContent = '아이폰 사파리에서는 홈 화면 앱으로 열어야 알림을 켤 수 있다.';
      show($('installCard'));
    } else {
      state.textContent = '이 브라우저는 웹 푸시를 지원하지 않는다';
      state.className = 'state err';
      desc.textContent = 'iOS 16.4 이상 사파리, 또는 크롬·엣지에서 열어라.';
    }
    return;
  }

  navigator.serviceWorker.register('/sw.js').then(function (reg) {
    return reg.pushManager.getSubscription().then(function (sub) {
      if (sub) return ready(sub);

      state.textContent = '알림이 꺼져 있다';
      desc.textContent = '아래 버튼을 누르면 이 기기로 방문 알림이 온다.';
      show($('enable'));

      $('enable').onclick = function () {
        $('enable').disabled = true;
        Notification.requestPermission().then(function (p) {
          if (p !== 'granted') {
            $('enable').disabled = false;
            state.textContent = '알림 권한이 거부됐다';
            state.className = 'state err';
            desc.textContent = '설정 → 알림에서 FOWARP 를 허용한 뒤 다시 시도해라.';
            return;
          }
          return reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: b64ToU8(VAPID),
          }).then(ready);
        }).catch(function (e) {
          $('enable').disabled = false;
          state.textContent = '등록 실패';
          state.className = 'state err';
          desc.textContent = String(e && e.message || e);
        });
      };
    });
  }).catch(function (e) {
    state.textContent = '서비스워커 등록 실패';
    state.className = 'state err';
    desc.textContent = String(e && e.message || e);
  });

  function ready(sub) {
    hide($('enable'));
    hide($('installCard'));
    state.textContent = '알림이 켜져 있다';
    state.className = 'state ok';
    desc.textContent = '방문자가 들어오면 잠금화면에 알림이 뜬다.';

    show($('test'));

    $('test').onclick = function () {
      $('test').disabled = true;
      $('test').textContent = '보내는 중…';
      fetch('/api/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phase: 'enter', path: '/', visits: 1, test: true }),
      }).then(function () {
        $('test').textContent = '보냈다 — 잠시 후 알림 확인';
      }).catch(function () {
        $('test').textContent = '실패';
      }).then(function () {
        setTimeout(function () {
          $('test').disabled = false;
          $('test').textContent = '테스트 알림 보내기';
        }, 3000);
      });
    };
  }
})();
</script>

</body>
</html>
